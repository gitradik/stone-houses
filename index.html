<body>

<div class="first-scroll">
    <div class="container">
        <div class="row">
            <div class="col-md-12 d-flex justify-content-center">
                <a class="home-link" href="/">
                    <div>
                        <img src="https://gitradik.github.io/stone-houses/assets/logo.jpg" alt="logo">
                    </div>
                </a>
            </div>
            <div class="col-md-12 text-center">
                <h1>
                    Индивидуальные решения строительства домов и коттеджей  под "Ключ"
                </h1>
            </div>
        </div>
    </div>
    <hr>
    <div class="container">
        <div class="row">
            <div class="col-md-12 col-xl-4 text-center d-flex align-items-center">
                <img src="https://gitradik.github.io/stone-houses/assets/images/1.jpg" alt="one">
            </div>
            <div class="col-md-6 col-xl-4">
                <div class="choice">
                    <h4>Выберите регион строительства:</h4>
                    <form name="myFormRadio" class="links">
                        <label class="labs">
                            <input name="radioFirstScroll" type="radio" value="zp">
                            <div class="bullet">
                                <div class="line zero"></div>
                                <div class="line one"></div>
                                <div class="line two"></div>
                                <div class="line three"></div>
                                <div class="line four"></div>
                                <div class="line five"></div>
                                <div class="line six"></div>
                                <div class="line seven"></div>
                            </div>
                            <div class="link-icon" style="background-image: url('https://gitradik.github.io/stone-houses/assets/images/zpLink.jpg')"></div>
                            <span>Запорожье и Запорожская область</span>
                        </label>
                        <label class="labs">
                            <input name="radioFirstScroll" type="radio" value="dnepr">
                            <div class="bullet">
                                <div class="line zero"></div>
                                <div class="line one"></div>
                                <div class="line two"></div>
                                <div class="line three"></div>
                                <div class="line four"></div>
                                <div class="line five"></div>
                                <div class="line six"></div>
                                <div class="line seven"></div>
                            </div>
                            <div class="link-icon" style="background-image: url('https://gitradik.github.io/stone-houses/assets/images/dneprLink.jpg')"></div>
                            <span>Днепропетровск и Днепропетровская область</span>
                        </label>
                    </form>
                </div>
            </div>
            <div class="col-md-6 col-xl-4">
                <form class="myFirstForm">
                    <div class="form-title">
                       Заполните форму и получите <span>БЕСПЛАТНУЮ</span>
                            консультацию специалиста на объекте
                    </div>
                    <input type="text" placeholder="Площадь">
                    <input type="text" placeholder="Имя">
                    <input type="text" placeholder="Телефон">
                    <button>Получить</button>
                </form>
            </div>
        </div>
    </div>
</div>
