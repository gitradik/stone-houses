    <link rel="stylesheet" href="components/construction-time/construction-time.css?v=0.2">
    <link rel="stylesheet" href="components/working/working.css?v=0.2">

</head>
    <script src="utils/includeHTML.js"></script>
<body>

<div class="first-scroll">
    <div class="container">
        <div class="row">
            <div class="col-md-12 d-flex justify-content-center">
                <a class="home-link" href="/">
                    <div>
                        <img src="https://gitradik.github.io/stone-houses/assets/logo.jpg" alt="logo">
                    </div>
                </a>
            </div>
            <div class="col-md-12 text-center">
                <h1>
                    Индивидуальные решения строительства домов и коттеджей  под "Ключ"
                </h1>
            </div>
        </div>
    </div>
    <hr>
    <div class="container">
        <div class="row">
            <div class="col-md-12 col-xl-4 text-center d-flex align-items-center">


                <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
                    <ol class="carousel-indicators">
                        <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
                        <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
                        <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
                    </ol>
                    <div class="carousel-inner">
                        <div class="carousel-item active" data-interval="3000">
                            <div style="background-image: url('https://gitradik.github.io/stone-houses/assets/images/6.jpg')">

                            </div>
                        </div>
                        <div class="carousel-item" data-interval="3000">
                            <div style="background-image: url('https://gitradik.github.io/stone-houses/assets/images/4.jpg')">

                            </div>
                        </div>
                        <div class="carousel-item" data-interval="3000">
                            <div style="background-image: url('https://gitradik.github.io/stone-houses/assets/images/3.jpg')">

                            </div>
                        </div>
                    </div>
                    <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="sr-only">Previous</span>
                    </a>
                    <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="sr-only">Next</span>
                    </a>
                </div>

            </div>
            <div class="col-md-6 col-xl-4">
                <div class="choice">
                    <h4>Выберите регион строительства:</h4>
                    <form name="myFormRadio" class="links">
                        <label class="labs">
                            <input name="radioFirstScroll" type="radio" value="zp">
                            <div class="bullet">
                                <div class="line zero"></div>
                                <div class="line one"></div>
                                <div class="line two"></div>
                                <div class="line three"></div>
                                <div class="line four"></div>
                                <div class="line five"></div>
                                <div class="line six"></div>
                                <div class="line seven"></div>
                            </div>
                            <div class="link-icon" style="background-image: url('https://gitradik.github.io/stone-houses/assets/images/zpLink.jpg')"></div>
                            <span>Запорожье и Запорожская область</span>
                        </label>
                        <label class="labs">
                            <input name="radioFirstScroll" type="radio" value="dnepr">
                            <div class="bullet">
                                <div class="line zero"></div>
                                <div class="line one"></div>
                                <div class="line two"></div>
                                <div class="line three"></div>
                                <div class="line four"></div>
                                <div class="line five"></div>
                                <div class="line six"></div>
                                <div class="line seven"></div>
                            </div>
                            <div class="link-icon" style="background-image: url('https://gitradik.github.io/stone-houses/assets/images/dneprLink.jpg')"></div>
                            <span>Днепропетровск и Днепропетровская область</span>
                        </label>
                    </form>
                </div>
            </div>
            <div class="col-md-6 col-xl-4">
                <form class="myFirstForm">
                    <div class="form-title">
                       Заполните форму и получите <span>БЕСПЛАТНУЮ</span>
                            консультацию специалиста на объекте
                    </div>
                    <input type="text" placeholder="Площадь м2">
                    <input type="text" placeholder="Имя">
                    <input type="text" placeholder="Телефон">
                    <button>Получить</button>
                </form>
            </div>
        </div>
    </div>
</div>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <script src="components/first-scroll/first-scroll.js"></script>
    <script>includeHTML();</script>
</body>
